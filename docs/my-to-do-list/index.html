<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="task1">
                <label for="task1" value="task1">Complete freeCodeCamp Project</label>
        
                <ul class="sub-item">
                    <li><a href="#" target="_blank" class="sub-item-link">View Project</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task2">
                <label for="task2" value="task2">Commit to GitHub</label>
            
                <ul class="sub-item">
                    <li><a href="#" target="_blank" class="sub-item-link">GitHub </a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task3">
                <label for="task3" value="task3">Journel</label>
            
                <ul class="sub-item">
                    <li><a href="#" target="_blank" class="sub-item-link">My Diary</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="task4">
                <label for="task4" value="task4">Search dress for the farewell</label>
            
                <ul class="sub-item">
                    <li><a href="#" target="_blank" class="sub-item-link">ShopCloud</a></li>
                </ul>
            </li>
        </ul>
    </div>

</body>

</html>
